# cargo-nextest settings. `cargo nextest run --workspace` uses the default
# profile; CI passes `--profile ci`.

[profile.default]
# Unit tests take milliseconds; anything slower is a bug or needs a fake Clock.
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false

# #150: a test that drains a deliberately stalled queue must fail within
# seconds if the queue is not bounded, not run until a CI timeout.
[[profile.default.overrides]]
filter = 'test(a_stalled_overlay_stays_bounded_and_ends_on_the_current_phase)'
slow-timeout = { period = "5s", terminate-after = 1 }

[profile.ci]
retries = 0
failure-output = "immediate-final"
fail-fast = false

# G2: the whole workspace now runs on the hosted macOS runner, where this
# real-clock test (a feeder thread paced by sleeps) was starved once and read
# silence. It passes alone and on Linux. Retry it twice there rather than
# let a scheduling hiccup fail a required check; the flake is tracked in a
# tech-debt issue.
[[profile.ci.overrides]]
filter = 'test(criterion_u4_1_levels_are_published_while_recording_only)'
retries = 2

[profile.ci.junit]
path = "junit.xml"
