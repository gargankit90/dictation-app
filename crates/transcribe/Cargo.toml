[package]
name = "dictation-transcribe"
description = "Speech-to-text engines behind the Transcriber port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
dictation-core.workspace = true
dictation-ports.workspace = true
httpdate.workspace = true
reqwest = { workspace = true, features = ["multipart", "rustls-no-provider"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true

[dev-dependencies]
hound.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util", "net", "io-util", "sync"] }
tracing-subscriber = { workspace = true, features = ["registry"] }
wiremock.workspace = true
