[package]
name = "dictation-pipeline"
description = "Orchestration: runs the core coordinator against the ports on an async runtime. No Tauri types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dictation-core.workspace = true
dictation-ports.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true

[dev-dependencies]
dictation-platform = { workspace = true, features = ["testing"] }
hound.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
