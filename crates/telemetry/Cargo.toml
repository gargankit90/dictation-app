[package]
name = "dictation-telemetry"
description = "The PostHog adapter for the Telemetry port: batched, bounded, a no-op without a build key, and the install ID."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
dictation-core.workspace = true
dictation-ports.workspace = true
getrandom = "0.3.4"
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util", "net", "io-util", "sync"] }
wiremock.workspace = true
