[package]
name = "dictation-platform"
description = "OS adapters behind the ports (macOS and Windows) and fakes for tests. The only crate allowed to use unsafe and cfg(target_os)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Fakes of every port for tests in other crates (`fakes`). Never enabled in
# release builds.
testing = []

[dependencies]
dictation-core.workspace = true
dictation-ports.workspace = true
# FileAudioSource, the `--debug-audio-file` test hook, reads WAVs.
hound.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
handy-keys.workspace = true
handy-recorder.workspace = true
block2.workspace = true
objc2.workspace = true
objc2-av-foundation = { workspace = true, features = [
    "std",
    "block2",
    "AVCaptureDevice",
    "AVMediaFormat",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Its fake microphone drives the real capture engine (ring buffer,
# resampler) in the adapter's tests.
handy-recorder = { workspace = true, features = ["test-backend"] }
