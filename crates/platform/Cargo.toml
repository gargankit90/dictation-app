[package]
name = "dictation-platform"
description = "OS adapters behind the ports (macOS and Windows) and fakes for tests. The only crate allowed to use unsafe and cfg(target_os)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Fakes of every port for tests in other crates (`fakes`). Never enabled in
# release builds.
testing = []

[dependencies]
dictation-core.workspace = true
dictation-ports.workspace = true
# FileAudioSource, the `--debug-audio-file` test hook, reads WAVs.
hound.workspace = true
# The overlay window (M5.1) is a Tauri window; only `overlay` uses it.
tauri.workspace = true
tracing.workspace = true

# statvfs, for free disk space (`disk`).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Turns the overlay window into a non-activating panel (M5.1).
tauri-nspanel.workspace = true
keyring = { workspace = true, features = ["apple-native"] }
handy-keys.workspace = true
handy-recorder.workspace = true
# Only for the leading delay of handy-recorder's resampler (M2.3).
rubato.workspace = true
# Only to read the current default input's id (M2.3).
cpal.workspace = true
block2.workspace = true
objc2.workspace = true
objc2-av-foundation = { workspace = true, features = [
    "std",
    "block2",
    "AVCaptureDevice",
    "AVMediaFormat",
] }
objc2-app-kit = { workspace = true, features = [
    "std",
    "NSPasteboard",
    "NSPasteboardItem",
    # Reading the overlay panel back (M5.1 M1).
    "NSPanel",
    "NSResponder",
    "NSWindow",
] }
objc2-core-graphics = { workspace = true, features = [
    "std",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }
objc2-foundation = { workspace = true, features = [
    "std",
    "block2",
    "NSDistributedNotificationCenter",
    "NSNotification",
    "NSOperation",
    "NSArray",
    "NSData",
    "NSError",
    "NSString",
    "NSThread",
] }
# Login item registration (M5.3).
objc2-service-management = { workspace = true, features = ["std", "objc2", "SMAppService", "objc2-foundation"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Its fake microphone drives the real capture engine (ring buffer,
# resampler) in the adapter's tests.
handy-recorder = { workspace = true, features = ["test-backend"] }
