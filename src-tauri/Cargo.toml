[package]
name = "dictation-app"
description = "Tauri shell for dictation-app: commands, events, tray and windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "dictation_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
anyhow.workspace = true
dictation-core = { workspace = true, features = ["specta"] }
dictation-pipeline.workspace = true
dictation-platform.workspace = true
dictation-ports.workspace = true
dictation-transcribe.workspace = true
tauri = { workspace = true, features = ["tray-icon", "macos-private-api"] }
tauri-specta.workspace = true
serde.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true
tauri-utils.workspace = true
dictation-platform = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
wiremock.workspace = true
