# Git hooks managed by lefthook. pre-commit runs fast checks on staged files.
# `pre-push-gate` is the full quality gate (scripts/gate.sh); scripts/pre-push
# runs it after the push guard, and you can run it by hand with
# `lefthook run pre-push-gate`.
#
# pre-push is NOT managed here: lefthook skips pre-push jobs when it finds no
# changed files, which would let a push to main through. scripts/install-hooks.sh
# writes git's pre-push hook itself, plus a copy of scripts/guard-push.sh next
# to it. The hook always runs that copy (and refuses the push without it), then
# runs the checkout's scripts/pre-push if the checkout has one.

pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: "*.rs"
      run: rustfmt --check --edition 2024 {staged_files}
    - name: prettier
      run: npx prettier --check --ignore-unknown {staged_files}
    - name: eslint
      glob: "*.{js,ts,tsx}"
      run: npx eslint --max-warnings 0 --no-warn-ignored {staged_files}
    - name: typos
      run: typos --force-exclude {staged_files}

pre-push-gate:
  jobs:
    - name: gate
      run: scripts/gate.sh
