# Tests may unwrap, expect, panic and dbg; production code may not.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
# Product and model names that doc comments use as words (`..` keeps
# clippy's own defaults).
doc-valid-idents = ["OrukQwen", ".."]
