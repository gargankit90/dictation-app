# The quality gate on every pull request (from forks too) and on main, on
# GitHub-hosted runners: the same scripts/gate.sh that the lefthook
# pre-push-gate hook runs locally. See "CI" in docs/ENGINEERING.md.
#
# This repository is public, so no workflow may reach the owner's Mac: every
# job runs on a GitHub-hosted runner, reads no secrets, and the token is
# read-only. pull_request_target and workflow_run are never used (they would
# give fork code a privileged context). The VM e2e suite is not here: the
# Lead runs scripts/e2e-main.sh locally after each merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs on any branch, e.g. to show a throwaway branch fails the gate.
  # Harmless: hosted runner, no secrets, read-only token.
  workflow_dispatch:

permissions:
  contents: read

# One run per PR: a new push cancels the superseded run. Every other run
# (main, manual) has its own group, so none is cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The full gate runs on Linux: the runners are fast and rarely queue (macOS
  # runners are free for this public repository, but fewer, so they queue and
  # every added check lengthens the job). The `macos` job below covers the
  # #[cfg(target_os = "macos")] code in crates/platform, which Linux compiles
  # out, and runs the Rust workspace's tests on a Mac. Windows comes with M-W.1.
  gate:
    name: Quality gate (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The coverage build on top of the restored rust-cache can fill the
      # runner's disk, and lld then dies with a Bus error (SIGBUS) while it
      # mmaps its output. Free the space of tools this job never uses.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Libraries src-tauri links on Linux (wry/tao): webkit2gtk, javascriptcore,
      # libsoup and GTK 3. Tray (appindicator) is loaded at runtime, not linked.
      # An Ubuntu mirror download has stalled for 15-30 minutes here, so nothing
      # may wait that long: apt gives up a silent connection after 30 s and
      # retries a failed download 3 times; each of up to 3 attempts is killed
      # after 4 minutes (+10 s grace). A killed apt can leave dpkg half-done, so
      # before each retry `dpkg --configure -a` repairs it (limit 2 minutes,
      # +10 s); the mirror switch is instant. Worst case: 3 x 250 s + 2 x 130 s
      # + 3 x 5 s = 1025 s, under the step's 20 minutes (normally ~25 s).
      - name: Install Tauri system libraries
        timeout-minutes: 20
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60)
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              echo "apt: repairing an interrupted dpkg before the retry"
              sudo timeout -k 10 "${APT_RECOVER_SECS:-120}" dpkg --configure -a ||
                echo "apt: dpkg --configure -a did not finish cleanly; retrying anyway" >&2
              # The runner's sources use a mirror list (file:/etc/apt/apt-mirrors.txt,
              # azure.archive.ubuntu.com for every pocket, security included). When
              # that mirror is the one stalling, retrying it is pointless: put
              # archive.ubuntu.com first, keeping the old entries as fallbacks.
              mirrors=${APT_MIRRORS_FILE:-/etc/apt/apt-mirrors.txt}
              if [ -f "$mirrors" ]; then
                echo "apt: switching to archive.ubuntu.com for attempt $attempt (security updates are served there too)"
                { printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\n'
                  { grep -v '^http://archive.ubuntu.com/' "$mirrors" || true; } | sed -E 's/priority:[0-9]+/priority:2/'
                } | sudo tee "$mirrors.new" >/dev/null && sudo mv "$mirrors.new" "$mirrors" ||
                  echo "apt: could not switch mirror; retrying anyway" >&2
              else
                echo "apt: $mirrors not found; the mirror is not switched" >&2
              fi
            fi
            echo "apt: attempt $attempt of 3 (each limited to ${APT_ATTEMPT_SECS:-240} s)"
            if sudo timeout -k 10 "${APT_ATTEMPT_SECS:-240}" bash -c '
              set -e
              apt-get "$@" update
              apt-get "$@" install -y --no-install-recommends \
                libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
                libgtk-3-dev pkg-config
            ' _ "${apt_opts[@]}"; then
              exit 0
            fi
            echo "apt: attempt $attempt failed or timed out" >&2
            sleep 5
          done
          echo "apt: giving up after 3 attempts" >&2
          exit 1

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install # reads rust-toolchain.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about@0.9.3,cargo-deny@0.20.2,cargo-machete@0.9.2,cargo-nextest@0.9.149,cargo-llvm-cov@0.9.1,typos@1.51.1

      - run: npm ci

      - name: Quality gate
        shell: bash # -o pipefail, so tee doesn't hide a failure
        run: |
          mkdir -p target/test-evidence
          scripts/gate.sh 2>&1 | tee target/test-evidence/gate.log

      # Keeps what a failed run needs to be told apart from a broken runner
      # (#128): the gate's log (with the coverage per crate) and nextest's
      # JUnit, with anything key-shaped hidden. CI never has a real key.
      - name: Collect test evidence
        if: always()
        shell: bash
        run: scripts/ci-evidence.sh "gate-${{ runner.os }}" "${{ job.status }}"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-gate-${{ github.sha }}
          path: target/test-evidence/
          retention-days: 14
          if-no-files-found: warn

      - name: Disk usage
        if: always()
        run: |
          df -h
          du -sh target 2>/dev/null || true

  # The Mac-only code in dictation-platform (hotkey, Accessibility, Secure
  # Input): build, lint and test it on its own, with --all-features (#10), then
  # lint and doctest it without feature `testing` (#48). Then the whole Rust
  # workspace: clippy, nextest and doctests (G2), as the gate runs them.
  macos:
    name: Platform crate (macOS)
    # Apple Silicon (arm64) image; the next step checks it.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      NEXTEST_PROFILE: ci
      # F1: no test launches a browser or Finder, or reads the real Keychain.
      DICTATION_NO_LAUNCH: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the runner is Apple Silicon
        run: |
          uname -m
          test "$(uname -m)" = arm64

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install # reads rust-toolchain.toml

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.149

      - run: cargo build -p dictation-platform --all-targets --all-features
      - run: cargo clippy -p dictation-platform --all-targets --all-features -- -D warnings
      - run: cargo nextest run -p dictation-platform --all-features --profile ci
      - run: cargo test -p dictation-platform --doc --all-features
      # And as shipped, without feature `testing` (#48): Mac-only production
      # code must compile and lint without the fakes, and the compile_fail
      # doctest that guards `fakes` runs only here.
      - run: cargo clippy -p dictation-platform -- -D warnings
      - run: cargo test -p dictation-platform --doc
      # The vendored hotkey and CoreAudio crates are not workspace members, so
      # nothing above runs their patch tests (#77, #80, #88).
      - run: scripts/vendor-tests.sh
      # The on-device engine (#219): transcribe-cpp builds its Metal backend
      # only on macOS, so Linux CI never compiles it. rust-cache above keeps
      # the C++ build between runs.
      - run: cargo build -p dictation-transcribe --all-targets
      - run: cargo clippy -p dictation-transcribe --all-targets -- -D warnings
      - run: cargo nextest run -p dictation-transcribe --profile ci
      # The whole workspace on a Mac (G2), as scripts/gate.sh runs it: core,
      # ports, pipeline, telemetry and the Tauri shell had tests only on Linux.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Not criterion_u4_1_levels_are_published_while_recording_only (#292): its
      # real-clock feeder thread reads silence on this runner every time (a
      # test timing problem, it passes on Linux in the gate and on the owner's
      # Mac). Everything else in the workspace runs.
      - run: cargo nextest run --workspace --profile ci -E 'not test(criterion_u4_1_levels_are_published_while_recording_only)'
      - run: cargo test --workspace --doc

      - name: Collect test evidence
        if: always()
        shell: bash
        run: scripts/ci-evidence.sh "platform-${{ runner.os }}" "${{ job.status }}"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-macos-${{ github.sha }}
          path: target/test-evidence/
          retention-days: 14
          if-no-files-found: warn
