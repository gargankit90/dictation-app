# The quality gate on every pull request and on main: the same scripts/gate.sh
# that the lefthook pre-push-gate hook runs locally.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs on any branch, e.g. to show a throwaway branch fails the gate.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install # reads rust-toolchain.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,cargo-nextest@0.9.149,cargo-llvm-cov@0.9.1,typos@1.51.1

      - run: npm ci

      - name: Quality gate
        run: scripts/gate.sh
