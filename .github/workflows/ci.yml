# The quality gate on every pull request and on main, on Linux: the same
# scripts/gate.sh that the lefthook pre-push-gate hook runs locally.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs on any branch, e.g. to show a throwaway branch fails the gate.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full gate runs on Linux: macOS minutes cost 10x and often queue for a
  # runner. The `macos` job below covers the #[cfg(target_os = "macos")] code
  # in crates/platform, which Linux compiles out. Windows comes with M-W.1.
  gate:
    name: Quality gate (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Libraries src-tauri links on Linux (wry/tao): webkit2gtk, javascriptcore,
      # libsoup and GTK 3. Tray (appindicator) is loaded at runtime, not linked.
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev pkg-config

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install # reads rust-toolchain.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,cargo-nextest@0.9.149,cargo-llvm-cov@0.9.1,typos@1.51.1

      - run: npm ci

      - name: Quality gate
        run: scripts/gate.sh

  # The Mac-only code in dictation-platform (hotkey, Accessibility, Secure
  # Input): build, lint and test it where it compiles (#10).
  macos:
    name: Platform crate (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install # reads rust-toolchain.toml

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.149

      - run: cargo build -p dictation-platform --all-targets --all-features
      - run: cargo clippy -p dictation-platform --all-targets --all-features -- -D warnings
      - run: cargo nextest run -p dictation-platform --all-features --profile ci
      - run: cargo test -p dictation-platform --doc --all-features
