# The quality gate on every pull request and on main, on the owner's Mac (a
# self-hosted runner): the same scripts/gate.sh that the lefthook
# pre-push-gate hook runs locally. See "CI runner" in docs/ENGINEERING.md.
#
# Safety on a self-hosted runner: pull requests run only when their branch is
# in this repository (never a fork), pull_request_target is never used, the
# token is read-only, and nothing here touches the Lume VMs.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs on any branch, e.g. to show a throwaway branch fails the gate.
  workflow_dispatch:

permissions:
  contents: read

# One run per PR: a new push cancels the superseded run. Every other run
# (main, manual) has its own group, so none is cancelled or replaced while
# pending (a shared group keeps only one pending run); the single runner
# serializes them.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The full gate runs on the Mac, so it also covers the
  # #[cfg(target_os = "macos")] code. Windows comes with M-W.1.
  gate:
    name: Quality gate (macOS, self-hosted)
    runs-on: [self-hosted, macOS, owner-mac]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      NEXTEST_PROFILE: ci
    steps:
      # clean: false keeps the ignored target/ and node_modules/ between runs
      # (the cache); the next step removes everything else, ignored files too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      # Ignored files such as src-tauri/permissions/autogenerated/ must not
      # survive a run, or they hide a missing generation step.
      - name: Remove untracked and ignored files, keep target/ and node_modules/
        run: git clean -ffdx -e /target/ -e /node_modules/

      - name: Check the runner's tools
        run: >-
          scripts/ci-check-tools.sh cargo-nextest cargo-deny cargo-machete
          cargo-llvm-cov cargo-about typos

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install # reads rust-toolchain.toml; a no-op when present

      - run: npm ci

      - name: Quality gate
        shell: bash # -o pipefail, so tee doesn't hide a failure
        run: |
          mkdir -p target/test-evidence
          scripts/gate.sh 2>&1 | tee target/test-evidence/gate.log

      # Keeps what a failed run needs to be told apart from a broken runner
      # (#128): the gate's log (with the coverage per crate) and nextest's
      # JUnit, with anything key-shaped hidden. CI never has a real key.
      - name: Collect test evidence
        if: always()
        shell: bash
        run: scripts/ci-evidence.sh "gate-${{ runner.os }}" "${{ job.status }}"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-gate-${{ github.sha }}
          path: target/test-evidence/
          retention-days: 14
          if-no-files-found: warn

      - name: Disk usage
        if: always()
        run: |
          df -h /
          du -sh target 2>/dev/null || true

  # The Mac-only code in dictation-platform (hotkey, Accessibility, Secure
  # Input): build, lint and test it on its own, with --all-features (#10), then
  # lint and doctest it without feature `testing` (#48).
  macos:
    name: Platform crate (macOS)
    runs-on: [self-hosted, macOS, owner-mac]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      # Ignored files such as src-tauri/permissions/autogenerated/ must not
      # survive a run, or they hide a missing generation step.
      - name: Remove untracked and ignored files, keep target/ and node_modules/
        run: git clean -ffdx -e /target/ -e /node_modules/

      - name: Check the runner's tools
        run: scripts/ci-check-tools.sh cargo-nextest

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install # reads rust-toolchain.toml; a no-op when present

      - run: cargo build -p dictation-platform --all-targets --all-features
      - run: cargo clippy -p dictation-platform --all-targets --all-features -- -D warnings
      - run: cargo nextest run -p dictation-platform --all-features --profile ci
      - run: cargo test -p dictation-platform --doc --all-features
      # And as shipped, without feature `testing` (#48): Mac-only production
      # code must compile and lint without the fakes, and the compile_fail
      # doctest that guards `fakes` runs only here.
      - run: cargo clippy -p dictation-platform -- -D warnings
      - run: cargo test -p dictation-platform --doc
      # The vendored hotkey and CoreAudio crates are not workspace members, so
      # nothing above runs their patch tests (#77, #80, #88).
      - run: scripts/vendor-tests.sh

      - name: Collect test evidence
        if: always()
        shell: bash
        run: scripts/ci-evidence.sh "platform-${{ runner.os }}" "${{ job.status }}"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-macos-${{ github.sha }}
          path: target/test-evidence/
          retention-days: 14
          if-no-files-found: warn
