# The VM e2e suite on every push to main (T6, #104): a break in what users
# see (paste, hotkey, permissions, tray, quit) is caught the same day. Runs on
# the owner's Mac like ci.yml (see "CI runner" in docs/ENGINEERING.md), and
# only on push to main: no pull_request trigger, so PRs never start it.
#
# The job borrows whichever Lume VM is free through run.sh's lock
# (tests/e2e/ci-run.sh: dictation-vm-2, then dictation-vm) and ends as
# "skipped: no VM free" (success) if both stay taken. A failed scenario fails
# this job; main's own checks are separate workflows, so it never turns them
# red. CI has no API key; the scenarios use the local provider. While this
# job runs (up to ~2 h), other CI jobs queue behind it: the runner takes one
# job at a time.
name: E2E

on:
  push:
    branches: [main]
  # Manual runs, e.g. to try the job on a branch.
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, none cancelled: each push is tested, in order.
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: VM e2e (macOS, self-hosted)
    runs-on: [self-hosted, macOS, owner-mac]
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Remove untracked and ignored files, keep target/ and node_modules/
        run: git clean -ffdx -e /target/ -e /node_modules/

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install # reads rust-toolchain.toml; a no-op when present

      - run: npm ci

      # Builds the app, borrows a VM, runs every scenario but the real-key and
      # real-mic ones, and collects target/e2e-evidence/.
      - name: VM e2e suite
        shell: bash
        run: tests/e2e/ci-run.sh

      # Kept even when the suite failed or was skipped: the per-scenario
      # summary, the SHA, the VM name and the logs (key shapes hidden).
      - name: Upload e2e evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence-${{ github.sha }}
          path: target/e2e-evidence/
          if-no-files-found: warn
          retention-days: 14
