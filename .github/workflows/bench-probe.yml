# BENCH1 feasibility probe: can a GitHub-hosted macOS runner run eval/app_bench instead of a local VM?
# A report only (eval/app_bench/ci_probe.sh): no keys, no dataset audio or text, never a required check.
# Runs on pushes to the bench branch that touch the bench.
name: Bench probe (macOS runner)

on:
  push:
    branches: [mBENCH1-app-bench]
    paths:
      - "eval/app_bench/**"
      - ".github/workflows/bench-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: macOS runner probe
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe
        run: |
          eval/app_bench/ci_probe.sh "$RUNNER_TEMP/probe.txt"
          { echo '```'; cat "$RUNNER_TEMP/probe.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - name: Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-probe
          path: ${{ runner.temp }}/probe.txt
