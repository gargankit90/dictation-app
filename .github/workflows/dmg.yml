# Builds the tester DMG on macOS (M5.4) and keeps it as a workflow artifact:
# on every PR that touches packaging, and on main. A separate file from
# ci.yml, so the quality gate stays on Linux and this one costs macOS minutes
# only when packaging changes.
#
# The DMG is signed ad hoc here: the `dictation-app Dev` certificate lives in
# the owner's keychain, not in CI (no secrets are added for it), and there is
# no Apple account for Developer ID signing or notarisation. An ad-hoc build
# runs, but macOS asks for Microphone and Accessibility again after each
# update. The DMG for testers is built on the owner's Mac with
# scripts/build-dmg.sh, which signs with the dev certificate.
name: DMG

on:
  pull_request:
    paths:
      - ".github/workflows/dmg.yml"
      - "src-tauri/**"
      - "scripts/build-dmg.sh"
      - "scripts/check-dmg.sh"
      - "scripts/gen-licences.sh"
      - "scripts/check-licences.sh"
      - "scripts/npm-licences.js"
      - "about.toml"
      - "about.hbs"
      - "NOTICE"
      - "THIRD-PARTY-LICENSES.txt"
      - "docs/testing/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: DMG (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install # reads rust-toolchain.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # build-dmg.sh checks the licence notice is current, which needs cargo-about.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about@0.9.3

      - run: npm ci

      - name: Build the DMG
        run: scripts/build-dmg.sh

      - name: Upload the DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictation-app-dmg
          # The DMG, the licence notice, the tester README and the checksums.
          path: target/dmg-out/
          if-no-files-found: error
          retention-days: 30
