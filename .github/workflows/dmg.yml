# Builds the tester DMG on macOS (M5.4) and keeps it as a workflow artifact:
# on every PR that touches packaging, and on main. A separate file from
# ci.yml, so this one runs only when packaging changes. It runs on the owner's
# Mac (a self-hosted runner; see "CI runner" in docs/ENGINEERING.md), with the
# same safety rules as ci.yml: no forks, no pull_request_target, read-only token.
#
# The DMG is signed ad hoc here: the `dictation-app Dev` certificate lives in
# the owner's keychain, not in CI (no secrets are added for it), and there is
# no Apple account for Developer ID signing or notarisation. An ad-hoc build
# runs, but macOS asks for Microphone and Accessibility again after each
# update. The DMG for testers is built on the owner's Mac with
# scripts/build-dmg.sh, which signs with the dev certificate.
name: DMG

on:
  pull_request:
    paths:
      - ".github/workflows/dmg.yml"
      - "src-tauri/**"
      - "scripts/build-dmg.sh"
      - "scripts/check-dmg.sh"
      - "scripts/gen-licences.sh"
      - "scripts/check-licences.sh"
      - "scripts/npm-licences.js"
      - "about.toml"
      - "about.hbs"
      - "NOTICE"
      - "THIRD-PARTY-LICENSES.txt"
      - "docs/testing/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Same rule as ci.yml: PR runs share a group per PR, others get their own.
concurrency:
  group: dmg-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dmg:
    name: DMG (macOS)
    runs-on: [self-hosted, macOS, owner-mac]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # The owner's keychain holds the `dictation-app Dev` certificate here, so
      # force the ad-hoc signing this workflow documents.
      DMG_ADHOC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      # Ignored files such as src-tauri/permissions/autogenerated/ must not
      # survive a run, or they hide a missing generation step.
      - name: Remove untracked and ignored files, keep target/ and node_modules/
        run: git clean -ffdx -e /target/ -e /node_modules/

      # build-dmg.sh checks the licence notice is current, which needs cargo-about.
      - name: Check the runner's tools
        run: scripts/ci-check-tools.sh cargo-about

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install # reads rust-toolchain.toml; a no-op when present

      - run: npm ci

      - name: Build the DMG
        run: scripts/build-dmg.sh

      - name: Upload the DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictation-app-dmg
          # The DMG, the licence notice, the tester README and the checksums.
          path: target/dmg-out/
          if-no-files-found: error
          retention-days: 30
