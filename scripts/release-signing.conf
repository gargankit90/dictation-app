# Which certificate signs a release (scripts/release.sh, docs/releasing.md).
# Nothing here is secret: the identity is in every signed app, and the profile
# is only the name of an item the owner keeps in their own Keychain.
#
# RELEASE_IDENTITY: the name `security find-identity -v -p codesigning` shows,
# e.g. Developer ID Application: Your Name (ABCDE12345). Empty means the
# fallback, "dictation-app Dev", not notarised. Once this names a certificate,
# a release fails rather than falls back if that certificate can't sign.
RELEASE_IDENTITY=Developer ID Application: Ankit Garg (XF2G42MVHN)
# RELEASE_NOTARY_PROFILE: the name given to `xcrun notarytool store-credentials`.
RELEASE_NOTARY_PROFILE=vocet-notary
