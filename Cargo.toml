[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/ports",
    "crates/platform",
    "crates/transcribe",
    "crates/app",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }

# Every crate opts in with `[lints] workspace = true`. Tests may unwrap
# (clippy.toml). `clippy::pedantic` is turned on in core's lib.rs, since a
# crate can't add to the workspace table.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
