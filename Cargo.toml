[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/ports",
    "crates/platform",
    "crates/transcribe",
    "crates/app",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
