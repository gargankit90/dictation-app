[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/ports",
    "crates/platform",
    "crates/transcribe",
    "crates/app",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
dictation-core = { path = "crates/core" }
dictation-ports = { path = "crates/ports" }
dictation-platform = { path = "crates/platform" }
dictation-pipeline = { path = "crates/app" }
dictation-transcribe = { path = "crates/transcribe" }

tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
tauri-plugin-single-instance = "2.5.5"
anyhow = "1.0.104"
thiserror = "2.0.21"
hound = "3.5.1"
tokio = "1.54.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
tracing-appender = "0.2.5"
reqwest = { version = "0.13.5", default-features = false }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wiremock = "0.6.5"
proptest = "1.12.0"
handy-keys = "0.3.4"

# Every crate opts in with `[lints] workspace = true`. Tests may unwrap
# (clippy.toml). `clippy::pedantic` is turned on in core's lib.rs, since a
# crate can't add to the workspace table.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
