[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/ports",
    "crates/platform",
    "crates/transcribe",
    "crates/telemetry",
    "crates/app",
    "src-tauri",
]
# Vendored, patched dependencies (see [patch.crates-io] below). Not members:
# they keep their upstream code, lints and tests.
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace.dependencies]
dictation-core = { path = "crates/core" }
dictation-ports = { path = "crates/ports" }
dictation-platform = { path = "crates/platform" }
dictation-pipeline = { path = "crates/app" }
dictation-transcribe = { path = "crates/transcribe" }
dictation-telemetry = { path = "crates/telemetry" }

tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
# In-app updates from GitHub Releases, verified with a minisign key (M5.4).
# Apache-2.0 OR MIT.
# No system-proxy: it pulls a second core-foundation (cargo deny bans).
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "zip"] }
# The native "up to date / update available" dialogs (M5.4). Apache-2.0 OR MIT.
tauri-plugin-dialog = "2"
# The overlay's non-activating NSPanel (M5.1). MIT OR Apache-2.0.
tauri-nspanel = "2.1.1"
# The ACL resolver Tauri itself uses, for the capability test (M1.7).
tauri-utils = "2.10.2"
anyhow = "1.0.104"
thiserror = "2.0.21"
hound = "3.5.1"
tokio = "1.54.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
reqwest = { version = "0.13.5", default-features = false }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
keyring = { version = "3.6.3", default-features = false }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
httpdate = "1.0.3"
wiremock = "0.6.5"
# On-device speech-to-text (L1): transcribe.cpp's Rust binding, MIT. Builds
# ggml from source with CMake and a C++ compiler. Pinned: the crate is 0.x.
# Backends are chosen per target in crates/transcribe (Metal on macOS).
# The native library refuses to load unless transcribe-cpp-sys has the same
# base version, and transcribe-cpp asks for it with a caret: keep the two
# equal in Cargo.lock (`cargo update -p transcribe-cpp-sys --precise <v>`).
transcribe-cpp = { version = "=0.4.1", default-features = false }
# SHA-256 of downloaded models (L1). MIT OR Apache-2.0; already in the tree.
sha2 = "0.10.9"
# statvfs for the free-space check before a model download (L1). MIT OR
# Apache-2.0; already in the tree.
libc = "0.2.191"
proptest = "1.12.0"
handy-keys = "0.3.4"
handy-recorder = "=0.1.0"
# The resampler handy-recorder uses, pinned to its version, to compute its
# output delay (platform::audio::macos).
rubato = "=5.0.0"
# The cpal fork handy-recorder uses, for the current default input (M2.3).
cpal = { package = "handy-cpal", version = "=0.18.2" }
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-service-management = { version = "0.3.2", default-features = false }

# coreaudio-rs 0.14.2 with a fix for its input callback buffer (#77 B2);
# see third_party/coreaudio-rs/PATCHES.md. Drop it once a fixed release is
# out and handy-cpal takes it.
#
# handy-keys 0.3.4 with the macOS hotkey fixes of M1.6 (#80): modifier
# direction from the event's flags, a modifier snapshot at start, and a
# notice when the event tap was disabled. third_party/handy-keys/PATCHES.md
# lists the changes; drop this once upstream ships them.
[patch.crates-io]
coreaudio-rs = { path = "third_party/coreaudio-rs" }
handy-keys = { path = "third_party/handy-keys" }

# Every crate opts in with `[lints] workspace = true`. Tests may unwrap
# (clippy.toml). `clippy::pedantic` is turned on in core's lib.rs, since a
# crate can't add to the workspace table.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"

# Hashing a downloaded model (L1, ~0.5 GB) takes about 25 s unoptimised;
# debug builds (tests, e2e) check it at first use, so optimise the hash.
[profile.dev.package.sha2]
opt-level = 3
