# typos: spell-checks code, comments and docs. Part of the quality gate.

[files]
extend-exclude = [
    "Cargo.lock",
    "package-lock.json",
    "src-tauri/icons/",
    "src-tauri/gen/",
    # Vendored upstream code, kept as published.
    "third_party/",
    # Licence texts from the crates and packages we ship, as published.
    "THIRD-PARTY-LICENSES.txt",
]

# ISO 639 language codes in src/languages.ts (Faroese, Bashkir).
[default.extend-words]
fo = "fo"
ba = "ba"
