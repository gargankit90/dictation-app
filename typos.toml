# typos: spell-checks code, comments and docs. Part of the quality gate.

[files]
extend-exclude = [
    "Cargo.lock",
    "package-lock.json",
    "src-tauri/icons/",
    "src-tauri/gen/",
    # Vendored upstream code, kept as published.
    "third_party/",
    # Licence texts from the crates and packages we ship, as published.
    "THIRD-PARTY-LICENSES.txt",
    # Benchmark output: transcripts keep the speech engine's misheard words as data.
    "eval/voicearena/results/",
    "eval/local-cleanup/runs/",
    "eval/local-cleanup/judge_cache/",
]

[default]
# Unicode ranges in the website font-face rules (site/index.html).
# The AMEND prompt fingerprint (eval/voicearena), a hex digest.
extend-ignore-re = ["U\\+[0-9A-Fa-f]{4}(-[0-9A-Fa-f]{4})?", "8ed04caf4663"]

# ISO 639 language codes in src/languages.ts (Faroese, Bashkir).
[default.extend-words]
fo = "fo"
ba = "ba"
