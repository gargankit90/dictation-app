# typos: spell-checks code, comments and docs. Part of the quality gate.

[files]
extend-exclude = [
    "Cargo.lock",
    "package-lock.json",
    "src-tauri/icons/",
    "src-tauri/gen/",
    # Vendored upstream code, kept as published.
    "third_party/",
    # Licence texts from the crates and packages we ship, as published.
    "THIRD-PARTY-LICENSES.txt",
]

[default]
# Unicode ranges in the website font-face rules (site/index.html).
extend-ignore-re = ["U\\+[0-9A-Fa-f]{4}(-[0-9A-Fa-f]{4})?"]
